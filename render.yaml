services:
  - type: web
    name: bienestar-estudiantil
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && gunicorn run:app --bind 0.0.0.0:$PORT
    preDeployCommand: cd backend && python provision.py
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: bienestar-db
          property: connectionString

databases:
  - name: bienestar-db
    plan: free