<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alertas - Bienestar Estudiantil</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/responsive.css">
    <style>
        .alert-list { display: flex; flex-direction: column; gap: 0.5rem; }
        .alert-item {
            display: flex; align-items: flex-start; gap: 1rem; padding: 1rem;
            border-radius: 8px; background: var(--bg-secondary, #f8f9fa);
            cursor: pointer; transition: all 0.2s; border-left: 4px solid transparent;
        }
        .alert-item:hover { background: var(--bg-hover, #e9ecef); }
        .alert-item.unread { border-left-color: var(--primary-color, #4f46e5); background: #eef2ff; }
        .alert-icon { font-size: 1.5rem; width: 40px; text-align: center; padding-top: 0.25rem; }
        .alert-body { flex: 1; }
        .alert-body h4 { margin: 0 0 0.25rem; font-size: 0.95rem; }
        .alert-body p { margin: 0; color: #666; font-size: 0.85rem; }
        .alert-date { font-size: 0.8rem; color: #999; white-space: nowrap; }
    </style>
</head>
<body>
    <div class="app-layout">
    <div class="sidebar-overlay" id="sidebar-overlay"></div>
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header"><div class="sidebar-logo"><div class="logo-icon"><i class="fas fa-heart-pulse"></i></div><div class="logo-text"><h2>Bienestar</h2><p>Estudiantil SENA</p></div></div></div>
        <nav class="sidebar-nav">
            <div class="nav-section">Principal</div>
            <a href="/dashboard" class="nav-item" data-page="dashboard"><i class="fas fa-home"></i> Inicio</a>
            <div class="nav-section">Gestión</div>
            <a href="/instituciones" class="nav-item" data-page="instituciones"><i class="fas fa-building"></i> Institución</a>
            <a href="/cursos" class="nav-item" data-page="cursos"><i class="fas fa-graduation-cap"></i> Académico</a>
            <a href="/usuarios" class="nav-item" data-page="usuarios"><i class="fas fa-users"></i> Usuarios</a>
            <div class="nav-section">Actividades</div>
            <a href="/actividades" class="nav-item" data-page="actividades"><i class="fas fa-calendar-alt"></i> Actividades</a>
            <a href="/programaciones" class="nav-item" data-page="programaciones"><i class="fas fa-calendar-check"></i> Programaciones</a>
            <div class="nav-section">Participación</div>
            <a href="/encuestas" class="nav-item" data-page="encuestas"><i class="fas fa-clipboard-list"></i> Encuestas</a>
            <a href="/propuestas" class="nav-item" data-page="propuestas"><i class="fas fa-lightbulb"></i> Propuestas</a>
            <a href="/alertas" class="nav-item active" data-page="alertas"><i class="fas fa-bell"></i> Alertas</a>
            <div class="nav-section">Sistema</div>
            <a href="/reportes" class="nav-item" data-page="reportes"><i class="fas fa-chart-bar"></i> Reportes</a>
            <a href="/auditoria" class="nav-item" data-page="auditoria"><i class="fas fa-history"></i> Auditoría</a>
            <a href="/configuracion" class="nav-item" data-page="configuracion"><i class="fas fa-cog"></i> Configuración</a>
        </nav>
        <div class="sidebar-footer"><div class="user-info"><div class="avatar" id="sidebar-avatar">--</div><div class="user-details"><h4 id="sidebar-user-name">Cargando...</h4><p id="sidebar-user-role">-</p></div></div></div>
    </aside>
        <main class="main-content">
            <header class="header">
                <div class="header-left"><button class="menu-toggle" id="menu-toggle"><i class="fas fa-bars"></i></button><div class="header-title"><h1>Alertas</h1></div></div>
                <div class="header-right">
                    <button class="notification-btn" onclick="window.location.href='/alertas'"><i class="fas fa-bell"></i><span class="badge" id="notif-badge" style="display:none">0</span></button>
                    <div class="header-user" onclick="window.location.href='/perfil'"><div class="avatar" id="header-avatar">--</div><div class="user-meta"><h4 id="header-user-name">Cargando...</h4><p id="header-user-role">-</p></div></div>
                    <button class="btn btn-sm btn-outlined" onclick="logout()"><i class="fas fa-sign-out-alt"></i></button>
                </div>
            </header>
            <div class="content">
                <div class="toolbar">
                    <div class="toolbar-left">
                        <span id="unread-count"></span>
                    </div>
                    <div class="toolbar-right">
                        <button class="btn btn-outlined" onclick="markAllRead()"><i class="fas fa-check-double"></i> Marcar todas como leídas</button>
                    </div>
                </div>
                <div class="alert-list" id="alert-list"></div>
            </div>
        </main>
    </div>

    <div class="modal-overlay" id="detail-modal">
        <div class="modal">
            <div class="modal-header">
                <h3>Detalle de Alerta</h3>
                <button class="modal-close" onclick="closeModal('detail-modal')">&times;</button>
            </div>
            <div class="modal-body" id="detail-content"></div>
            <div class="modal-footer">
                <button class="btn btn-outlined" onclick="closeModal('detail-modal')">Cerrar</button>
            </div>
        </div>
    </div>

    <script src="/static/js/app.js"></script>
    <script>
        if (!checkAuth()) throw new Error('No auth');
        let allAlertas = [];

        const alertIcons = {
            'info': '<i class="fas fa-info-circle" style="color:#3b82f6"></i>',
            'success': '<i class="fas fa-check-circle" style="color:#22c55e"></i>',
            'warning': '<i class="fas fa-exclamation-triangle" style="color:#f59e0b"></i>',
            'error': '<i class="fas fa-times-circle" style="color:#ef4444"></i>',
            'nueva_propuesta': '<i class="fas fa-lightbulb" style="color:#f59e0b"></i>',
            'nueva_encuesta': '<i class="fas fa-clipboard-list" style="color:#8b5cf6"></i>',
            'programacion': '<i class="fas fa-calendar-check" style="color:#3b82f6"></i>',
            'sistema': '<i class="fas fa-cog" style="color:#6b7280"></i>'
        };

        async function loadData() {
            try {
                const data = await apiRequest('/alertas');
                allAlertas = data.alertas || data || [];
                renderAlertas();
            } catch (e) {
                showToast('Error al cargar alertas', 'error');
            }
        }

        function renderAlertas() {
            const container = document.getElementById('alert-list');
            const unread = allAlertas.filter(a => !a.leida).length;
            document.getElementById('unread-count').innerHTML = unread > 0 ? `<strong>${unread}</strong> sin leer` : 'Todo leído';
            if (allAlertas.length === 0) {
                container.innerHTML = '<div class="text-center p-4"><i class="fas fa-bell-slash fa-3x text-muted"></i><p class="mt-2">No hay alertas</p></div>';
                return;
            }
            container.innerHTML = allAlertas.map(a => {
                const icon = alertIcons[a.tipo] || alertIcons['info'];
                return `
                <div class="alert-item ${a.leida ? '' : 'unread'}" onclick="markAsRead(${a.id})">
                    <div class="alert-icon">${icon}</div>
                    <div class="alert-body">
                        <h4>${a.titulo}</h4>
                        <p>${a.descripcion || ''}</p>
                    </div>
                    <div class="alert-date">${formatDate(a.fecha)}</div>
                </div>`;
            }).join('');
        }

        async function markAsRead(id) {
            const alerta = allAlertas.find(a => a.id === id);
            if (alerta && !alerta.leida) {
                try {
                    await apiRequest('/alertas/' + id + '/leer', { method: 'PUT' });
                    alerta.leida = true;
                    renderAlertas();
                } catch (e) {
                    showToast('Error al marcar alerta', 'error');
                }
            }
        }

        async function markAllRead() {
            try {
                await apiRequest('/alertas/leer-todas', { method: 'PUT' });
                allAlertas.forEach(a => a.leida = true);
                renderAlertas();
                showToast('Todas las alertas marcadas como leídas', 'success');
            } catch (e) {
                showToast('Error al marcar alertas', 'error');
            }
        }

        loadData();
    </script>
</body>
</html>
