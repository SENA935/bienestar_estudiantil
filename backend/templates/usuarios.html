<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usuarios - Bienestar Estudiantil</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/responsive.css">
</head>
<body>
    <div class="sidebar-overlay"></div>
    <aside class="sidebar">
        <div class="sidebar-header">
            <div class="logo-icon"><img src="/static/img/logoo1.png" alt="Logo" style="width:90%;max-width:100px;height:auto"></div>
            <div>
                <h2>Bienestar Estudiantil</h2>
                <small>Salud Mental y Pausas Activas</small>
            </div>
        </div>
        <nav class="sidebar-nav"></nav>
    </aside>
    <header class="header">
        <div class="header-left">
            <button class="menu-toggle"><i class="fas fa-bars"></i></button>
            <a href="/" title="Volver a la página principal" style="color:var(--text-primary);margin-right:10px;font-size:18px"><i class="fas fa-home"></i></a>
            <h2 class="header-title">Usuarios</h2>
        </div>
        <div class="header-right">
            <button class="notification-btn" onclick="window.location.href='/alertas'">
                <i class="fas fa-bell"></i>
                <span class="notification-badge" style="display:none">0</span>
            </button>
            <div class="user-menu">
                <div class="user-avatar"></div>
                <div class="user-info">
                    <div class="name"></div>
                    <div class="role"></div>
                </div>
                <div class="user-dropdown">
                    <a href="/perfil"><i class="fas fa-user"></i> Mi perfil</a>
                    <a href="#" onclick="event.preventDefault();logout()"><i class="fas fa-sign-out-alt"></i> Cerrar sesión</a>
                </div>
            </div>
        </div>
    </header>
    <main class="main-content">
        <div class="page-header">
            <h1>Usuarios</h1>
            <div class="page-header-actions">
                <button class="btn btn-primary" onclick="openModal()"><i class="fas fa-plus"></i> Nuevo Usuario</button>
            </div>
        </div>
        <div class="card">
            <div class="card-body">
                <div class="toolbar">
                    <div class="search-box">
                        <i class="fas fa-search"></i>
                        <input type="text" id="searchInput" placeholder="Buscar usuario...">
                    </div>
                    <select id="filterRol">
                        <option value="">Todos los roles</option>
                    </select>
                    <select id="filterEstado">
                        <option value="">Todos los estados</option>
                        <option value="Activo">Activo</option>
                        <option value="Inactivo">Inactivo</option>
                    </select>
                </div>
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>Nombre</th>
                                <th>Email</th>
                                <th>Username</th>
                                <th>Rol</th>
                                <th>Estado</th>
                                <th>Fecha</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="usuariosTable">
                            <tr><td colspan="7" class="empty-state"><p>Cargando...</p></td></tr>
                        </tbody>
                    </table>
                </div>
                <div class="pagination" id="usuariosPagination"></div>
            </div>
        </div>
    </main>

    <div class="modal-overlay" id="usuarioModal">
        <div class="modal">
            <div class="modal-header">
                <h3 id="usuarioModalTitle">Nuevo Usuario</h3>
                <button class="modal-close" onclick="Modal.close('usuarioModal')"><i class="fas fa-times"></i></button>
            </div>
            <form id="usuarioForm">
                <div class="modal-body">
                    <div class="form-grid">
                        <div class="form-group">
                            <label>Nombre</label>
                            <input type="text" name="nombre" class="form-control" required>
                        </div>
                        <div class="form-group">
                            <label>Apellido</label>
                            <input type="text" name="apellido" class="form-control" required>
                        </div>
                    </div>
                    <div class="form-grid">
                        <div class="form-group">
                            <label>Username</label>
                            <input type="text" name="username" class="form-control" required>
                        </div>
                        <div class="form-group">
                            <label>Email</label>
                            <input type="email" name="email" class="form-control" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Contraseña <small style="color:var(--text-muted)">(dejar vacío para no cambiar)</small></label>
                        <input type="password" name="password" class="form-control">
                    </div>
                    <div class="form-grid">
                        <div class="form-group">
                            <label>Rol</label>
                            <select name="rol_id" class="form-control" required>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Estado</label>
                            <select name="estado" class="form-control">
                                <option value="Activo">Activo</option>
                                <option value="Inactivo">Inactivo</option>
                            </select>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline" onclick="Modal.close('usuarioModal')">Cancelar</button>
                    <button type="submit" class="btn btn-primary">Guardar</button>
                </div>
            </form>
        </div>
    </div>

    <script src="/static/js/app.js"></script>
    <script src="/static/js/usuarios.js"></script>
</body>
</html>
