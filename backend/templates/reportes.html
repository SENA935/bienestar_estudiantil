<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reportes - Bienestar Estudiantil</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/responsive.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="sidebar-overlay"></div>
    <aside class="sidebar">
        <div class="sidebar-header">
            <div class="logo-icon"><img src="/static/img/logoo1.png" alt="Logo" style="width:90%;max-width:100px;height:auto"></div>
            <div>
                <h2>Bienestar Estudiantil</h2>
                <small>Salud Mental y Pausas Activas</small>
            </div>
        </div>
        <nav class="sidebar-nav"></nav>
    </aside>
    <header class="header">
        <div class="header-left">
            <button class="menu-toggle"><i class="fas fa-bars"></i></button>
            <a href="/" title="Volver a la página principal" style="color:var(--text-primary);margin-right:10px;font-size:18px"><i class="fas fa-home"></i></a>
            <h2 class="header-title">Reportes</h2>
        </div>
        <div class="header-right">
            <button class="notification-btn" onclick="window.location.href='/alertas'">
                <i class="fas fa-bell"></i>
                <span class="notification-badge" style="display:none">0</span>
            </button>
            <div class="user-menu">
                <div class="user-avatar"></div>
                <div class="user-info">
                    <div class="name"></div>
                    <div class="role"></div>
                </div>
                <div class="user-dropdown">
                    <a href="/perfil"><i class="fas fa-user"></i> Mi perfil</a>
                    <a href="#" onclick="event.preventDefault();logout()"><i class="fas fa-sign-out-alt"></i> Cerrar sesión</a>
                </div>
            </div>
        </div>
    </header>
    <main class="main-content">
        <div class="page-header">
            <h1>Reportes</h1>
            <div class="page-header-actions">
                <button class="btn btn-outline btn-sm" id="exportCsv"><i class="fas fa-download"></i> Exportar CSV</button>
            </div>
        </div>
        <div class="card" style="margin-bottom:24px">
            <div class="card-body">
                <form id="filterForm" style="display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap">
                    <div class="form-group" style="margin-bottom:0">
                        <label>Fecha Inicio</label>
                        <input type="date" id="fechaInicio" class="form-control">
                    </div>
                    <div class="form-group" style="margin-bottom:0">
                        <label>Fecha Fin</label>
                        <input type="date" id="fechaFin" class="form-control">
                    </div>
                    <button type="submit" class="btn btn-primary"><i class="fas fa-filter"></i> Filtrar</button>
                </form>
            </div>
        </div>
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-icon green"><i class="fas fa-check-circle"></i></div>
                <div class="stat-info">
                    <h4>Actividades Realizadas</h4>
                    <div class="stat-value" id="rep-act">0</div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon orange"><i class="fas fa-poll"></i></div>
                <div class="stat-info">
                    <h4>Encuestas Respondidas</h4>
                    <div class="stat-value" id="rep-enc">0</div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon purple"><i class="fas fa-lightbulb"></i></div>
                <div class="stat-info">
                    <h4>Total Propuestas</h4>
                    <div class="stat-value" id="rep-prop">0</div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon teal"><i class="fas fa-thumbs-up"></i></div>
                <div class="stat-info">
                    <h4>Propuestas Aprobadas</h4>
                    <div class="stat-value" id="rep-aprob">0</div>
                </div>
            </div>
        </div>
        <div class="charts-grid">
            <div class="card">
                <div class="card-header"><h3>Actividades por Categoría</h3></div>
                <div class="card-body">
                    <div class="chart-container"><canvas id="reportChartCategoria"></canvas></div>
                </div>
            </div>
            <div class="card">
                <div class="card-header"><h3>Actividades por Curso</h3></div>
                <div class="card-body">
                    <div class="chart-container"><canvas id="reportChartCurso"></canvas></div>
                </div>
            </div>
        </div>
    </main>
    <script src="/static/js/app.js"></script>
    <script src="/static/js/reportes.js"></script>
</body>
</html>
