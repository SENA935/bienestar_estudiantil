<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Programaciones - Bienestar Estudiantil</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/responsive.css">
</head>
<body>
    <div class="sidebar-overlay"></div>
    <aside class="sidebar">
        <div class="sidebar-header">
            <div class="logo-icon"><img src="/static/img/logoo1.png" alt="Logo" style="width:90%;max-width:100px;height:auto"></div>
            <div>
                <h2>Bienestar Estudiantil</h2>
                <small>Salud Mental y Pausas Activas</small>
            </div>
        </div>
        <nav class="sidebar-nav"></nav>
    </aside>
    <header class="header">
        <div class="header-left">
            <button class="menu-toggle"><i class="fas fa-bars"></i></button>
            <a href="/" title="Volver a la página principal" style="color:var(--text-primary);margin-right:10px;font-size:18px"><i class="fas fa-home"></i></a>
            <h2 class="header-title">Programaciones</h2>
        </div>
        <div class="header-right">
            <button class="notification-btn" onclick="window.location.href='/alertas'">
                <i class="fas fa-bell"></i>
                <span class="notification-badge" style="display:none">0</span>
            </button>
            <div class="user-menu">
                <div class="user-avatar"></div>
                <div class="user-info">
                    <div class="name"></div>
                    <div class="role"></div>
                </div>
                <div class="user-dropdown">
                    <a href="/perfil"><i class="fas fa-user"></i> Mi perfil</a>
                    <a href="#" onclick="event.preventDefault();logout()"><i class="fas fa-sign-out-alt"></i> Cerrar sesión</a>
                </div>
            </div>
        </div>
    </header>
    <main class="main-content">
        <div class="page-header">
            <h1>Programaciones</h1>
            <div class="page-header-actions">
                <button class="btn btn-primary" onclick="openModal()"><i class="fas fa-plus"></i> Nueva Programación</button>
            </div>
        </div>
        <div class="card">
            <div class="card-body">
                <div class="toolbar">
                    <select id="filterEstado" onchange="load()">
                        <option value="">Todos los estados</option>
                        <option value="Programada">Programada</option>
                        <option value="En curso">En curso</option>
                        <option value="Finalizada">Finalizada</option>
                        <option value="Cancelada">Cancelada</option>
                    </select>
                </div>
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>Actividad</th>
                                <th>Curso</th>
                                <th>Fecha</th>
                                <th>Hora Inicio</th>
                                <th>Lugar</th>
                                <th>Estado</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="programacionesTable">
                            <tr><td colspan="7" class="empty-state"><p>Cargando...</p></td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <div class="modal-overlay" id="programacionModal">
        <div class="modal">
            <div class="modal-header">
                <h3 id="programacionModalTitle">Nueva Programación</h3>
                <button class="modal-close" onclick="Modal.close('programacionModal')"><i class="fas fa-times"></i></button>
            </div>
            <form id="programacionForm">
                <div class="modal-body">
                    <div class="form-grid">
                        <div class="form-group">
                            <label>Actividad</label>
                            <select name="actividad_id" id="progActividad" class="form-control" required></select>
                        </div>
                        <div class="form-group">
                            <label>Curso</label>
                            <select name="curso_id" id="progCurso" class="form-control" required></select>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Fecha</label>
                        <input type="date" name="fecha" class="form-control" required>
                    </div>
                    <div class="form-grid">
                        <div class="form-group">
                            <label>Hora Inicio</label>
                            <input type="time" name="hora_inicio" class="form-control" required>
                        </div>
                        <div class="form-group">
                            <label>Hora Final</label>
                            <input type="time" name="hora_final" class="form-control">
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Lugar</label>
                        <input type="text" name="lugar" class="form-control">
                    </div>
                    <div class="form-group">
                        <label>Estado</label>
                        <select name="estado" class="form-control">
                            <option value="Programada">Programada</option>
                            <option value="En curso">En curso</option>
                            <option value="Finalizada">Finalizada</option>
                            <option value="Cancelada">Cancelada</option>
                        </select>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline" onclick="Modal.close('programacionModal')">Cancelar</button>
                    <button type="submit" class="btn btn-primary">Guardar</button>
                </div>
            </form>
        </div>
    </div>

    <script src="/static/js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded',async()=>{if(!Auth.checkAuth())return;initLayout();await Promise.all([load(),loadSelects()]);document.getElementById('programacionForm')?.addEventListener('submit',save)});
        async function loadSelects(){const[ar,cr]=await Promise.all([Api.get('/api/actividades'),Api.get('/api/cursos?per_page=100')]);if(ar&&ar.success){const s=document.getElementById('progActividad');ar.data.actividades.forEach(a=>{s.innerHTML+=`<option value="${a.id}">${a.titulo}</option>`})}if(cr&&cr.success){const s=document.getElementById('progCurso');cr.data.cursos.forEach(c=>{s.innerHTML+=`<option value="${c.id}">${c.nombre}</option>`})}}
        async function load(){const es=document.getElementById('filterEstado')?.value||'';const r=await Api.get(`/api/programaciones?estado=${es}`);if(!r||!r.success)return;const tb=document.getElementById('programacionesTable');if(!tb)return;const items=r.data.programaciones;if(!items.length){tb.innerHTML='<tr><td colspan="7" class="empty-state"><i class="fas fa-calendar-alt"></i><h3>No hay programaciones</h3></td></tr>';return}tb.innerHTML=items.map(p=>`<tr><td>${p.actividad_titulo||'-'}</td><td>${p.curso_nombre||'-'}</td><td>${p.fecha}</td><td>${p.hora_inicio||'-'}</td><td>${p.lugar||'-'}</td><td><span class="badge badge-${gb(p.estado)}">${p.estado}</span></td><td><div class="table-actions"><button class="btn btn-sm btn-primary" onclick="editItem(${p.id})" title="Editar"><i class="fas fa-edit"></i></button><button class="btn btn-sm btn-danger" onclick="delItem(${p.id})" title="Eliminar"><i class="fas fa-trash"></i></button></div></td></tr>`).join('')}
        function gb(e){return{Programada:'info','En curso':'warning',Finalizada:'success',Cancelada:'danger'}[e]||'info'}
        async function save(e){e.preventDefault();const f=e.target,id=f.dataset.id,d={actividad_id:parseInt(f.actividad_id.value),curso_id:parseInt(f.curso_id.value),fecha:f.fecha.value,hora_inicio:f.hora_inicio.value,hora_final:f.hora_final.value||null,lugar:f.lugar.value,estado:f.estado.value};let r=id?await Api.put(`/api/programaciones/${id}`,d):await Api.post('/api/programaciones',d);if(r&&r.success){Toast.show(r.message,'success');Modal.close('programacionModal');f.reset();f.dataset.id='';load()}else Toast.show(r?.message||'Error','error')}
        async function editItem(id){const r=await Api.get('/api/programaciones');if(!r||!r.success)return;const p=r.data.programaciones.find(x=>x.id===id);if(!p)return;const f=document.getElementById('programacionForm');f.dataset.id=id;f.actividad_id.value=p.actividad_id;f.curso_id.value=p.curso_id;f.fecha.value=p.fecha;f.hora_inicio.value=p.hora_inicio||'';f.hora_final.value=p.hora_final||'';f.lugar.value=p.lugar||'';f.estado.value=p.estado;document.getElementById('programacionModalTitle').textContent='Editar Programación';Modal.open('programacionModal')}
        async function delItem(id){if(!await Modal.confirm('¿Eliminar esta programación?'))return;const r=await Api.delete(`/api/programaciones/${id}`);if(r&&r.success){Toast.show('Eliminada','success');load()}}
        function openModal(){const f=document.getElementById('programacionForm');f.reset();f.dataset.id='';document.getElementById('programacionModalTitle').textContent='Nueva Programación';Modal.open('programacionModal')}
    </script>
</body>
</html>
