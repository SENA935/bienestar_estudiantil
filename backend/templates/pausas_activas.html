<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pausas Activas - Bienestar Estudiantil</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/responsive.css">
    <style>
        .pausas-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:24px;padding:24px 0}
        .pausa-card-new{background:var(--card-bg);border-radius:16px;overflow:hidden;box-shadow:var(--shadow);transition:transform .2s}
        .pausa-card-new:hover{transform:translateY(-4px)}
        .pausa-card-header{padding:20px;display:flex;justify-content:space-between;align-items:center}
        .pausa-card-icon{width:48px;height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px}
        .pausa-card-meta{display:flex;gap:8px}
        .pausa-badge{background:rgba(255,255,255,.7);padding:4px 10px;border-radius:20px;font-size:12px;font-weight:600;display:flex;align-items:center;gap:4px}
        .pausa-card-body{padding:20px}
        .pausa-card-body h3{margin:0 0 8px;font-size:18px}
        .pausa-desc{color:var(--text-muted);font-size:14px;margin:0 0 12px}
        .pausa-instrucciones{background:var(--bg-secondary);border-radius:10px;padding:12px;margin:12px 0;font-size:13px}
        .pausa-instrucciones p{margin:6px 0 0;line-height:1.5}
        .pausa-video{margin:12px 0;border-radius:10px;overflow:hidden;position:relative;padding-top:56.25%;height:0}
        .pausa-video iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:0;border-radius:10px}
        .pausa-actions{display:flex;align-items:center;gap:12px;margin-top:16px;flex-wrap:wrap}
        .timer-circle{width:80px;height:80px;position:relative}
        .timer-circle svg{width:100%;height:100%;transform:rotate(-90deg)}
        .timer-bg{fill:none;stroke:var(--border);stroke-width:6}
        .timer-progress{fill:none;stroke:var(--primary);stroke-width:6;stroke-linecap:round;transition:stroke-dashoffset 1s linear}
        .timer-text{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:16px;font-weight:700}
        .pausa-admin-actions{display:flex;gap:6px;margin-top:10px}
        .modal-body .form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
        @media(max-width:480px){.pausas-grid{grid-template-columns:1fr}}
    </style>
</head>
<body>
    <div class="sidebar-overlay"></div>
    <aside class="sidebar">
        <div class="sidebar-header">
            <div class="logo-icon"><img src="/static/img/logoo1.png" alt="Logo" style="width:90%;max-width:100px;height:auto"></div>
            <div>
                <h2>Bienestar Estudiantil</h2>
                <small>Salud Mental y Pausas Activas</small>
            </div>
        </div>
        <nav class="sidebar-nav"></nav>
    </aside>
    <header class="header">
        <div class="header-left">
            <button class="menu-toggle"><i class="fas fa-bars"></i></button>
            <a href="/" title="Volver a la página principal" style="color:var(--text-primary);margin-right:10px;font-size:18px"><i class="fas fa-home"></i></a>
            <h2 class="header-title">Pausas Activas</h2>
        </div>
        <div class="header-right">
            <button class="notification-btn" onclick="window.location.href='/alertas'">
                <i class="fas fa-bell"></i>
                <span class="notification-badge" style="display:none">0</span>
            </button>
            <div class="user-menu">
                <div class="user-avatar"></div>
                <div class="user-info">
                    <div class="name"></div>
                    <div class="role"></div>
                </div>
                <div class="user-dropdown">
                    <a href="/perfil"><i class="fas fa-user"></i> Mi perfil</a>
                    <a href="#" onclick="event.preventDefault();logout()"><i class="fas fa-sign-out-alt"></i> Cerrar sesión</a>
                </div>
            </div>
        </div>
    </header>
    <main class="main-content">
        <div class="page-header">
            <div>
                <h1>Pausas Activas</h1>
                <p style="color:var(--text-muted);font-size:14px;margin-top:4px">Toma un descanso activo para mejorar tu bienestar</p>
            </div>
            <div class="page-header-actions" id="pageActions" style="display:none">
                <button class="btn btn-primary" onclick="openModal()"><i class="fas fa-plus"></i> Nueva Pausa Activa</button>
            </div>
        </div>
        <div class="pausas-grid" id="pausasGrid">
            <div style="grid-column:1/-1;text-align:center;padding:40px;color:var(--text-muted)"><i class="fas fa-spinner fa-spin"></i> Cargando...</div>
        </div>
    </main>

    <div class="modal-overlay" id="pausaModal">
        <div class="modal">
            <div class="modal-header">
                <h3 id="pausaModalTitle">Nueva Pausa Activa</h3>
                <button class="modal-close" onclick="Modal.close('pausaModal')"><i class="fas fa-times"></i></button>
            </div>
            <form id="pausaForm">
                <div class="modal-body">
                    <div class="form-group">
                        <label>Nombre</label>
                        <input type="text" name="nombre" class="form-control" required placeholder="Ej: Estiramiento de Cuello">
                    </div>
                    <div class="form-group">
                        <label>Descripción</label>
                        <textarea name="descripcion" class="form-control" rows="2" placeholder="Breve descripción de la pausa"></textarea>
                    </div>
                    <div class="form-group">
                        <label>Instrucciones</label>
                        <textarea name="instrucciones" class="form-control" rows="3" placeholder="Pasos a seguir durante la pausa"></textarea>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Duración (segundos)</label>
                            <input type="number" name="duracion_segundos" class="form-control" value="180" min="30" max="3600">
                        </div>
                        <div class="form-group">
                            <label>Dificultad</label>
                            <select name="dificultad" class="form-control">
                                <option value="Facil">Fácil</option>
                                <option value="Moderado">Moderado</option>
                                <option value="Avanzado">Avanzado</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Color</label>
                            <input type="color" name="color" class="form-control" value="#087f8c" style="height:42px;padding:4px">
                        </div>
                        <div class="form-group">
                            <label>Icono (Font Awesome)</label>
                            <select name="icono" class="form-control">
                                <option value="fa-heart">Corazón</option>
                                <option value="fa-hand-sparkles">Manos</option>
                                <option value="fa-wind">Viento/Respiración</option>
                                <option value="fa-eye">Ojo/Visual</option>
                                <option value="fa-child-reaching">Estiramiento</option>
                                <option value="fa-person-walking">Caminar</option>
                                <option value="fa-brain">Cerebro</option>
                                <option value="fa-spa">Spa/Relajación</option>
                                <option value="fa-dumbbell">Ejercicio</option>
                                <option value="fa-music">Música</option>
                                <option value="fa-sun">Sol/Energía</option>
                                <option value="fa-om">Meditación</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>URL del Video (opcional - YouTube, Vimeo, etc.)</label>
                        <input type="url" name="video_url" class="form-control" placeholder="https://www.youtube.com/watch?v=...">
                    </div>
                    <div class="form-group">
                        <label>Estado</label>
                        <select name="estado" class="form-control">
                            <option value="Activa">Activa</option>
                            <option value="Inactiva">Inactiva</option>
                        </select>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline" onclick="Modal.close('pausaModal')">Cancelar</button>
                    <button type="submit" class="btn btn-primary">Guardar</button>
                </div>
            </form>
        </div>
    </div>

    <script src="/static/js/app.js"></script>
    <script>
        let userRole='',activeTimer=null,activeInterval=null;
        const ICONS={'fa-heart':'&#xf004;','fa-hand-sparkles':'&#xf4c6;','fa-wind':'&#xf72e;','fa-eye':'&#xf06e;','fa-child-reaching':'&#xf4c4;','fa-person-walking':'&#xf554;','fa-brain':'&#xf5dc;','fa-spa':'&#xf5bb;','fa-dumbbell':'&#xf44b;','fa-music':'&#xf001;','fa-sun':'&#xf185;','fa-om':'&#xf675;'};

        document.addEventListener('DOMContentLoaded', async()=>{
            if(!Auth.checkAuth())return;
            userRole=Auth.getRol();
            initLayout();
            if(userRole==='Administrador'||userRole==='Coordinador'||userRole==='Profesor'){
                document.getElementById('pageActions').style.display='flex';
            }
            await loadPausas();
            document.getElementById('pausaForm').addEventListener('submit',save);
        });

        function embedUrl(url){
            if(!url)return'';
            let m=url.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/))([^&?#]+)/);
            if(m)return`https://www.youtube.com/embed/${m[1]}`;
            m=url.match(/vimeo\.com\/(\d+)/);
            if(m)return`https://player.vimeo.com/video/${m[1]}`;
            return url;
        }

        async function loadPausas(){
            const endpoint=(userRole==='Administrador'||userRole==='Coordinador'||userRole==='Profesor')?'/api/pausas/todas':'/api/pausas';
            const r=await Api.get(endpoint);
            const grid=document.getElementById('pausasGrid');
            if(!r||!r.success||!r.data.length){grid.innerHTML='<div style="grid-column:1/-1;text-align:center;padding:60px 20px;color:var(--text-muted)"><i class="fas fa-spa" style="font-size:48px;margin-bottom:12px;display:block;opacity:.3"></i><h3>No hay pausas activas</h3><p>Crea una nueva pausa activa para comenzar</p></div>';return}
            const isAdmin=['Administrador','Coordinador','Profesor'].includes(userRole);
            grid.innerHTML=r.data.map(p=>{
                const min=Math.floor(p.duracion_segundos/60);
                const sec=p.duracion_segundos%60;
                const timeStr=sec>0?`${min}m ${sec}s`:`${min} min`;
                const diffBadge=p.dificultad==='Facil'?'success':p.dificultad==='Moderado'?'warning':'danger';
                const videoHtml=p.video_url?`<div class="pausa-video"><iframe src="${embedUrl(p.video_url)}" allowfullscreen></iframe></div>`:'';
                const adminBtns=isAdmin?`<div class="pausa-admin-actions"><button class="btn btn-sm btn-primary" onclick="editItem(${p.id})" title="Editar"><i class="fas fa-edit"></i></button><button class="btn btn-sm btn-danger" onclick="delItem(${p.id})" title="Eliminar"><i class="fas fa-trash"></i></button></div>`:'';
                const inactiveBadge=p.estado==='Inactiva'?'<span class="badge badge-danger" style="margin-left:8px">Inactiva</span>':'';
                return`<div class="pausa-card-new" data-id="${p.id}" data-name="${p.nombre}" data-seconds="${p.duracion_segundos}" data-color="${p.color}" data-bg="${p.bg_gradient}" data-icon="${p.icono}">
                    <div class="pausa-card-header" style="background:${p.bg_gradient}">
                        <div class="pausa-card-icon" style="background:${p.color}22;color:${p.color}"><i class="fas ${p.icono}"></i></div>
                        <div class="pausa-card-meta">
                            <span class="pausa-badge"><i class="fas fa-clock"></i> ${timeStr}</span>
                            <span class="pausa-badge"><i class="fas fa-signal"></i> ${p.dificultad}</span>
                        </div>
                    </div>
                    <div class="pausa-card-body">
                        <h3>${p.nombre}${inactiveBadge}</h3>
                        <p class="pausa-desc">${p.descripcion||''}</p>
                        ${p.instrucciones?`<div class="pausa-instrucciones"><strong><i class="fas fa-list-ul"></i> Instrucciones:</strong><p>${p.instrucciones}</p></div>`:''}
                        ${videoHtml}
                        <div class="pausa-actions">
                            <button class="btn btn-primary btn-pausa" onclick="iniciarPausa(this)"><i class="fas fa-play"></i> Iniciar</button>
                            <div class="pausa-timer" style="display:none">
                                <div class="timer-circle">
                                    <svg viewBox="0 0 100 100"><circle class="timer-bg" cx="50" cy="50" r="45"/><circle class="timer-progress" cx="50" cy="50" r="45"/></svg>
                                    <span class="timer-text">${String(min).padStart(2,'0')}:${String(sec).padStart(2,'0')}</span>
                                </div>
                                <button class="btn btn-outline btn-sm btn-stop" onclick="detenerPausa(this)"><i class="fas fa-stop"></i> Detener</button>
                            </div>
                        </div>
                        ${adminBtns}
                    </div>
                </div>`}).join('');
        }

        function iniciarPausa(btn){
            const card=btn.closest('.pausa-card-new');
            const seconds=parseInt(card.dataset.seconds);
            const name=card.dataset.name;
            const timerEl=card.querySelector('.pausa-timer');
            const timerText=card.querySelector('.timer-text');
            const progress=card.querySelector('.timer-progress');
            const circumference=2*Math.PI*45;
            progress.style.strokeDasharray=circumference;
            progress.style.strokeDashoffset=0;
            btn.parentElement.style.display='none';
            timerEl.style.display='flex';
            let remaining=seconds;
            const total=seconds;
            function updateDisplay(){
                const m=Math.floor(remaining/60);
                const s=remaining%60;
                timerText.textContent=`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
                progress.style.strokeDashoffset=circumference*(1-remaining/total);
            }
            updateDisplay();
            activeTimer={card,btn,remaining,total,name};
            activeInterval=setInterval(()=>{
                remaining--;
                activeTimer.remaining=remaining;
                updateDisplay();
                if(remaining<=0){
                    clearInterval(activeInterval);activeInterval=null;activeTimer=null;
                    progress.style.strokeDashoffset=circumference;
                    timerText.textContent='00:00';
                    Toast.show(`¡${name} completada! Excelente trabajo`,'success');
                    setTimeout(()=>{btn.parentElement.style.display='';timerEl.style.display='none'},2500);
                }
            },1000);
        }

        function detenerPausa(btn){
            if(activeInterval){clearInterval(activeInterval);activeInterval=null}
            const card=btn.closest('.pausa-card-new');
            card.querySelector('.pausa-timer').style.display='none';
            card.querySelector('.btn-pausa').parentElement.style.display='';
            activeTimer=null;
        }

        function openModal(id){
            const f=document.getElementById('pausaForm');
            f.reset();f.dataset.id='';
            document.getElementById('pausaModalTitle').textContent='Nueva Pausa Activa';
            Modal.open('pausaModal');
        }

        async function editItem(id){
            const r=await Api.get('/api/pausas/todas');
            if(!r||!r.success)return;
            const p=r.data.find(x=>x.id===id);
            if(!p)return;
            const f=document.getElementById('pausaForm');
            f.dataset.id=id;
            f.nombre.value=p.nombre;
            f.descripcion.value=p.descripcion||'';
            f.instrucciones.value=p.instrucciones||'';
            f.duracion_segundos.value=p.duracion_segundos;
            f.dificultad.value=p.dificultad;
            f.color.value=p.color;
            f.icono.value=p.icono;
            f.video_url.value=p.video_url||'';
            f.estado.value=p.estado;
            document.getElementById('pausaModalTitle').textContent='Editar Pausa Activa';
            Modal.open('pausaModal');
        }

        async function save(e){
            e.preventDefault();
            const f=e.target,id=f.dataset.id;
            const d={
                nombre:f.nombre.value,descripcion:f.descripcion.value,
                instrucciones:f.instrucciones.value,
                duracion_segundos:parseInt(f.duracion_segundos.value)||180,
                dificultad:f.dificultad.value,color:f.color.value,
                icono:f.icono.value,video_url:f.video_url.value||null,
                estado:f.estado.value
            };
            let r=id?await Api.put(`/api/pausas/${id}`,d):await Api.post('/api/pausas',d);
            if(r&&r.success){Toast.show(r.message,'success');Modal.close('pausaModal');loadPausas()}
            else Toast.show(r?.message||'Error','error');
        }

        async function delItem(id){
            if(!await Modal.confirm('¿Eliminar esta pausa activa?'))return;
            const r=await Api.delete(`/api/pausas/${id}`);
            if(r&&r.success){Toast.show('Eliminada','success');loadPausas()}
        }
    </script>
</body>
</html>
