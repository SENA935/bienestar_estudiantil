<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cursos - Bienestar Estudiantil</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/responsive.css">
</head>
<body>
    <div class="sidebar-overlay"></div>
    <aside class="sidebar">
        <div class="sidebar-header">
            <div class="logo-icon"><img src="/static/img/logoo1.png" alt="Logo" style="width:90%;max-width:100px;height:auto"></div>
            <div>
                <h2>Bienestar Estudiantil</h2>
                <small>Salud Mental y Pausas Activas</small>
            </div>
        </div>
        <nav class="sidebar-nav"></nav>
    </aside>
    <header class="header">
        <div class="header-left">
            <button class="menu-toggle"><i class="fas fa-bars"></i></button>
            <a href="/" title="Volver a la p�gina principal" style="color:var(--text-primary);margin-right:10px;font-size:18px"><i class="fas fa-home"></i></a>
            <h2 class="header-title">Cursos</h2>
        </div>
        <div class="header-right">
            <button class="notification-btn" onclick="window.location.href='/alertas'">
                <i class="fas fa-bell"></i>
                <span class="notification-badge" style="display:none">0</span>
            </button>
            <div class="user-menu">
                <div class="user-avatar"></div>
                <div class="user-info">
                    <div class="name"></div>
                    <div class="role"></div>
                </div>
                <div class="user-dropdown">
                    <a href="/perfil"><i class="fas fa-user"></i> Mi perfil</a>
                    <a href="#" onclick="event.preventDefault();logout()"><i class="fas fa-sign-out-alt"></i> Cerrar sesión</a>
                </div>
            </div>
        </div>
    </header>
    <main class="main-content">
        <div class="page-header">
            <h1>Cursos</h1>
            <div class="page-header-actions">
                <button class="btn btn-primary" onclick="openModal()"><i class="fas fa-plus"></i> Nuevo Curso</button>
            </div>
        </div>
        <div class="card">
            <div class="card-body">
                <div class="toolbar">
                    <div class="search-box">
                        <i class="fas fa-search"></i>
                        <input type="text" id="searchInput" placeholder="Buscar curso...">
                    </div>
                    <select id="filterGrado" class="form-control" style="width:auto">
                        <option value="">Todos los grados</option>
                        <option value="10°">10°</option>
                        <option value="11°">11°</option>
                        <option value="9°">9°</option>
                        <option value="8°">8°</option>
                        <option value="7°">7°</option>
                        <option value="6°">6°</option>
                        <option value="5°">5°</option>
                        <option value="4°">4°</option>
                        <option value="3°">3°</option>
                        <option value="2°">2°</option>
                        <option value="1°">1°</option>
                    </select>
                    <select id="filterJornada" class="form-control" style="width:auto">
                        <option value="">Todas las jornadas</option>
                        <option value="Mañana">Mañana</option>
                        <option value="Tarde">Tarde</option>
                        <option value="Nocturna">Nocturna</option>
                    </select>
                    <select id="filterEstado" class="form-control" style="width:auto">
                        <option value="">Todos los estados</option>
                        <option value="Activo">Activo</option>
                        <option value="Inactivo">Inactivo</option>
                    </select>
                </div>
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>Nombre</th>
                                <th>Grado</th>
                                <th>Jornada</th>
                                <th>Director</th>
                                <th>Estado</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="cursosTable">
                            <tr><td colspan="6" class="empty-state"><p>Cargando...</p></td></tr>
                        </tbody>
                    </table>
                </div>
                <div class="p�gination"></div>
            </div>
        </div>
        <div class="card" id="estudiantesSection" style="margin-top:24px">
            <div class="card-header">
                <h3 id="estudiantesTitle">Estudiantes</h3>
                <div style="display:flex;gap:8px;align-items:center">
                    <select id="filterCurso" class="form-control" style="width:auto" onchange="selectCursoFromFilter()">
                        <option value="">Seleccionar curso...</option>
                    </select>
                    <button class="btn btn-sm btn-primary" onclick="openEstudianteModal()"><i class="fas fa-plus"></i> Nuevo Estudiante</button>
                </div>
            </div>
            <div class="card-body">
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>Nombre</th>
                                <th>Apellido</th>
                                <th>Documento</th>
                                <th>Email</th>
                                <th>Estado</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="estudiantesTable">
                            <tr><td colspan="5" class="empty-state"><p>No hay estudiantes</p></td></tr>
                        </tbody>
                    </table>
                </div>
                <div class="p�gination"></div>
            </div>
        </div>
    </main>

    <div class="modal-overlay" id="cursoModal">
        <div class="modal">
            <div class="modal-header">
                <h3 id="cursoModalTitle">Nuevo Curso</h3>
                <button class="modal-close" onclick="Modal.close('cursoModal')"><i class="fas fa-times"></i></button>
            </div>
            <form id="cursoForm">
                <div class="modal-body">
                    <div class="form-group">
                        <label>Nombre</label>
                        <input type="text" name="nombre" class="form-control" required>
                    </div>
                    <div class="form-grid">
                        <div class="form-group">
                            <label>Grado</label>
                            <input type="text" name="grado" class="form-control" required>
                        </div>
                        <div class="form-group">
                            <label>Jornada</label>
                            <select name="jornada" class="form-control">
                                <option value="Mañana">Mañana</option>
                                <option value="Tarde">Tarde</option>
                                <option value="Nocturna">Nocturna</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Director de Grupo</label>
                        <select name="director_grupo" class="form-control" id="directorGrupoSelect">
                            <option value="">Sin asignar</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Estado</label>
                        <select name="estado" class="form-control">
                            <option value="Activo">Activo</option>
                            <option value="Inactivo">Inactivo</option>
                        </select>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline" onclick="Modal.close('cursoModal')">Cancelar</button>
                    <button type="submit" class="btn btn-primary">Guardar</button>
                </div>
            </form>
        </div>
    </div>

    <div class="modal-overlay" id="estudianteModal">
        <div class="modal">
            <div class="modal-header">
                <h3 id="estudianteModalTitle">Nuevo Estudiante</h3>
                <button class="modal-close" onclick="Modal.close('estudianteModal')"><i class="fas fa-times"></i></button>
            </div>
            <form id="estudianteForm">
                <div class="modal-body">
                    <div class="form-grid">
                        <div class="form-group">
                            <label>Nombre</label>
                            <input type="text" name="nombre" class="form-control" required>
                        </div>
                        <div class="form-group">
                            <label>Apellido</label>
                            <input type="text" name="apellido" class="form-control" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Documento</label>
                        <input type="text" name="documento" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label>Estado</label>
                        <select name="estado" class="form-control">
                            <option value="Activo">Activo</option>
                            <option value="Inactivo">Inactivo</option>
                        </select>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline" onclick="Modal.close('estudianteModal')">Cancelar</button>
                    <button type="submit" class="btn btn-primary">Guardar</button>
                </div>
            </form>
        </div>
    </div>

    <script src="/static/js/app.js"></script>
    <script>
        let currentPage=1,selectedCursoId=null;
        document.addEventListener('DOMContentLoaded',async()=>{if(!Auth.checkAuth())return;initLayout();await load();await loadCursoFilter();await loadDirectores();document.getElementById('searchInput')?.addEventListener('input',debounce(()=>{currentPage=1;load()},300));document.getElementById('filterGrado')?.addEventListener('change',()=>{currentPage=1;load()});document.getElementById('filterJornada')?.addEventListener('change',()=>{currentPage=1;load()});document.getElementById('filterEstado')?.addEventListener('change',()=>{currentPage=1;load()});document.getElementById('cursoForm')?.addEventListener('submit',save);document.getElementById('estudianteForm')?.addEventListener('submit',saveEstudiante)});
        async function loadDirectores(){const r=await Api.get('/api/usuarios?per_page=100&rol=Profesor');const r2=await Api.get('/api/usuarios?per_page=100&rol=Director de grupo');const s=document.getElementById('directorGrupoSelect');if(!s)return;let users=[];if(r&&r.success)users=users.concat(r.data.usuarios);if(r2&&r2.success)users=users.concat(r2.data.usuarios);s.innerHTML='<option value="">Sin asignar</option>'+users.map(u=>`<option value="${u.nombre} ${u.apellido}">${u.nombre} ${u.apellido}</option>`).join('')}
        async function load(){
            const s=document.getElementById('searchInput')?.value||'';
            const g=document.getElementById('filterGrado')?.value||'';
            const j=document.getElementById('filterJornada')?.value||'';
            const es=document.getElementById('filterEstado')?.value||'';
            const res=await Api.get(`/api/cursos?page=${currentPage}&per_page=10&search=${s}&grado=${g}&jornada=${j}&estado=${es}`);
            if(!res||!res.success)return;
            const{cursos:items,total,pages,current_page:cp}=res.data;
            const tb=document.getElementById('cursosTable');
            if(!tb)return;
            if(!items.length){tb.innerHTML='<tr><td colspan="6" class="empty-state"><i class="fas fa-graduation-cap"></i><h3>No hay cursos</h3></td></tr>';return}
            tb.innerHTML=items.map(c=>`<tr><td><a href="#" onclick="showEstudiantes(${c.id},'${c.nombre}');return false" style="color:var(--primary);font-weight:600;text-decoration:underline">${c.nombre}</a></td><td>${c.grado}</td><td>${c.jornada||'-'}</td><td>${c.director_grupo||'-'}</td><td><span class="badge badge-${c.estado==='Activo'?'success':'danger'}">${c.estado}</span></td><td><div class="table-actions"><button class="btn btn-sm btn-primary" onclick="editItem(${c.id})" title="Editar"><i class="fas fa-edit"></i></button><button class="btn btn-sm btn-danger" onclick="delItem(${c.id})" title="Eliminar"><i class="fas fa-trash"></i></button></div></td></tr>`).join('');
            renderp�gination',pages,cp,p=>{currentPage=p;load()});
            await loadCursoFilter();
        }
        async function loadCursoFilter(){
            const res=await Api.get('/api/cursos?per_page=100');
            if(!res||!res.success)return;
            const sel=document.getElementById('filterCurso');
            if(!sel)return;
            const current=sel.value;
            sel.innerHTML='<option value="">Seleccionar curso...</option>'+res.data.cursos.map(c=>`<option value="${c.id}" ${c.id==current?'selected':''}>${c.nombre} (${c.grado})</option>`).join('');
        }
        function selectCursoFromFilter(){
            const id=document.getElementById('filterCurso')?.value;
            if(id){selectedCursoId=parseInt(id);estPage=1;document.getElementById('estudiantesTitle').textContent='Estudiantes del curso';loadEstudiantes()}else{document.getElementById('estudiantesTable').innerHTML='<tr><td colspan="5" class="empty-state"><p>Selecciona un curso para ver sus estudiantes</p></td></tr>'}
        }
        async function save(e){e.preventDefault();const f=e.target,id=f.dataset.id,d={nombre:f.nombre.value,grado:f.grado.value,jornada:f.jornada.value,director_grupo:f.director_grupo.value,estado:f.estado.value};let res=id?await Api.put(`/api/cursos/${id}`,d):await Api.post('/api/cursos',d);if(res&&res.success){Toast.show(res.message,'success');Modal.close('cursoModal');f.reset();f.dataset.id='';load()}else Toast.show(res?.message||'Error','error')}
        async function editItem(id){const res=await Api.get(`/api/cursos?per_page=100`);if(!res||!res.success)return;const c=res.data.cursos.find(x=>x.id===id);if(!c)return;const f=document.getElementById('cursoForm');f.dataset.id=id;f.nombre.value=c.nombre;f.grado.value=c.grado;f.jornada.value=c.jornada||'Mañana';document.getElementById('directorGrupoSelect').value=c.director_grupo||'';f.estado.value=c.estado;document.getElementById('cursoModalTitle').textContent='Editar Curso';Modal.open('cursoModal')}
        async function delItem(id){if(!await Modal.confirm('¿Eliminar este curso?'))return;const r=await Api.delete(`/api/cursos/${id}`);if(r&&r.success){Toast.show('Eliminado','success');load()}else Toast.show(r?.message||'Error al eliminar','error')}
        function openModal(){const f=document.getElementById('cursoForm');f.reset();f.dataset.id='';document.getElementById('cursoModalTitle').textContent='Nuevo Curso';Modal.open('cursoModal')}
        let estPage=1;
        async function showEstudiantes(id,name){selectedCursoId=id;estPage=1;const sel=document.getElementById('filterCurso');if(sel)sel.value=id;document.getElementById('estudiantesTitle').textContent=`Estudiantes - ${name}`;await loadEstudiantes()}
        async function loadEstudiantes(){if(!selectedCursoId)return;const res=await Ap�gination',pages,cp,p=>{estPage=p;loadEstudiantes()})}
        function openEstudianteModal(){if(!selectedCursoId){Toast.show('Primero selecciona un curso haciendo clic en su nombre o desde el filtro','warning');return}const f=document.getElementById('estudianteForm');f.reset();f.dataset.id='';document.getElementById('estudianteModalTitle').textContent='Nuevo Estudiante';Modal.open('estudianteModal')}
        async function saveEstudiante(e){e.preventDefault();const f=e.target,id=f.dataset.id;if(!id&&!selectedCursoId){Toast.show('Selecciona un curso primero','error');return}const d={nombre:f.nombre.value,apellido:f.apellido.value,documento:f.documento.value,estado:f.estado.value};let r=id?await Api.put(`/api/cursos/estudiantes/${id}`,d):await Api.post(`/api/cursos/${selectedCursoId}/estudiantes`,d);if(r&&r.success){if(!id&&r.credenciales){Toast.show(`Estudiante creado. Email: ${r.credenciales.email} | Contraseña: ${r.credenciales.contrasena}`,'success',8000)}else{Toast.show(r.message,'success')}Modal.close('estudianteModal');f.reset();f.dataset.id='';await loadEstudiantes();await load()}else Toast.show(r?.message||'Error','error')}
        async function editEstudiante(id){const res=await Api.get(`/api/cursos/${selectedCursoId}/estudiantes?page=1&per_page=100`);if(!res||!res.success)return;const e=res.data.estudiantes.find(x=>x.id===id);if(!e)return;const f=document.getElementById('estudianteForm');f.dataset.id=id;f.nombre.value=e.nombre;f.apellido.value=e.apellido;f.documento.value=e.documento||'';f.estado.value=e.estado;document.getElementById('estudianteModalTitle').textContent='Editar Estudiante';Modal.open('estudianteModal')}
        async function delEstudiante(id){if(!await Modal.confirm('¿Eliminar este estudiante?'))return;const r=await Api.delete(`/api/cursos/estudiantes/${id}`);if(r&&r.success){Toast.show('Eliminado','success');loadEstudiantes()}}
        function renderp�gina ${cp} de ${tp}</span><button class="next-btn" ${cp>=tp?'disabled':''}>→</button>`;c.querySelector('.prev-btn').addEventListener('click',()=>fn(cp-1));c.querySelector('.next-btn').addEventListener('click',()=>fn(cp+1))}
        function debounce(fn,d){let t;return(...a)=>{clearTimeout(t);t=setTimeout(()=>fn(...a),d)}}
    </script>
</body>
</html>
