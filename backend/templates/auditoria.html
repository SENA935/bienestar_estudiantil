<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auditoría - Bienestar Estudiantil</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/responsive.css">
</head>
<body>
    <div class="sidebar-overlay"></div>
    <aside class="sidebar">
        <div class="sidebar-header">
            <div class="logo-icon"><img src="/static/img/logoo1.png" alt="Logo" style="width:90%;max-width:100px;height:auto"></div>
            <div>
                <h2>Bienestar Estudiantil</h2>
                <small>Salud Mental y Pausas Activas</small>
            </div>
        </div>
        <nav class="sidebar-nav"></nav>
    </aside>
    <header class="header">
        <div class="header-left">
            <button class="menu-toggle"><i class="fas fa-bars"></i></button>
            <a href="/" title="Volver a la página principal" style="color:var(--text-primary);margin-right:10px;font-size:18px"><i class="fas fa-home"></i></a>
            <h2 class="header-title">Auditoría</h2>
        </div>
        <div class="header-right">
            <button class="notification-btn" onclick="window.location.href='/alertas'">
                <i class="fas fa-bell"></i>
                <span class="notification-badge" style="display:none">0</span>
            </button>
            <div class="user-menu">
                <div class="user-avatar"></div>
                <div class="user-info">
                    <div class="name"></div>
                    <div class="role"></div>
                </div>
                <div class="user-dropdown">
                    <a href="/perfil"><i class="fas fa-user"></i> Mi perfil</a>
                    <a href="#" onclick="event.preventDefault();logout()"><i class="fas fa-sign-out-alt"></i> Cerrar sesión</a>
                </div>
            </div>
        </div>
    </header>
    <main class="main-content">
        <div class="page-header">
            <h1>Auditoría</h1>
        </div>
        <div class="card">
            <div class="card-body">
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>Usuario</th>
                                <th>Módulo</th>
                                <th>Acción</th>
                                <th>Descripción</th>
                                <th>Fecha</th>
                                <th>IP</th>
                            </tr>
                        </thead>
                        <tbody id="auditoriaTable">
                            <tr><td colspan="6" class="empty-state"><p>Cargando...</p></td></tr>
                        </tbody>
                    </table>
                </div>
                <div class="pagination" id="auditoriaPagination"></div>
            </div>
        </div>
    </main>
    <script src="/static/js/app.js"></script>
    <script>
        let aPage=1;
        document.addEventListener('DOMContentLoaded',async()=>{if(!Auth.checkAuth())return;initLayout();await load()});
        async function load(){const r=await Api.get(`/api/auditoria?page=${aPage}`);if(!r||!r.success){document.getElementById('auditoriaTable').innerHTML='<tr><td colspan="6" class="empty-state"><i class="fas fa-history"></i><h3>Sin permisos para ver la auditoría</h3></td></tr>';return}const{registros:items,pages,current_page:cp}=r.data;const tb=document.getElementById('auditoriaTable');if(!tb)return;if(!items.length){tb.innerHTML='<tr><td colspan="6" class="empty-state"><i class="fas fa-history"></i><h3>No hay registros de auditoría</h3></td></tr>';return}tb.innerHTML=items.map(a=>`<tr><td>${a.usuario_nombre||'Sistema'}</td><td>${a.modulo||'-'}</td><td><span class="badge badge-${a.accion==='CREAR'?'success':a.accion==='ELIMINAR'?'danger':a.accion==='LOGIN'?'info':'primary'}">${a.accion}</span></td><td>${a.descripcion||'-'}</td><td>${a.fecha?new Date(a.fecha).toLocaleString():'-'}</td><td>${a.ip_address||'-'}</td></tr>`).join('');renderPag('auditoriaPagination',pages,cp,p=>{aPage=p;load()})}
        function renderPag(id,tp,cp,fn){const c=document.getElementById(id);if(!c)return;if(tp<=1){c.innerHTML='';return}c.innerHTML=`<button class="prev-btn" ${cp<=1?'disabled':''}>←</button><span class="page-info">Página ${cp} de ${tp}</span><button class="next-btn" ${cp>=tp?'disabled':''}>→</button>`;c.querySelector('.prev-btn').addEventListener('click',()=>fn(cp-1));c.querySelector('.next-btn').addEventListener('click',()=>fn(cp+1))}
    </script>
</body>
</html>
