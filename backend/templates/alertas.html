<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alertas - Bienestar Estudiantil</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/responsive.css">
</head>
<body>
    <div class="sidebar-overlay"></div>
    <aside class="sidebar">
        <div class="sidebar-header">
            <div class="logo-icon"><img src="/static/img/logoo1.png" alt="Logo" style="width:90%;max-width:100px;height:auto"></div>
            <div>
                <h2>Bienestar Estudiantil</h2>
                <small>Salud Mental y Pausas Activas</small>
            </div>
        </div>
        <nav class="sidebar-nav"></nav>
    </aside>
    <header class="header">
        <div class="header-left">
            <button class="menu-toggle"><i class="fas fa-bars"></i></button>
            <a href="/" title="Volver a la página principal" style="color:var(--text-primary);margin-right:10px;font-size:18px"><i class="fas fa-home"></i></a>
            <h2 class="header-title">Alertas</h2>
        </div>
        <div class="header-right">
            <button class="notification-btn" onclick="window.location.href='/alertas'">
                <i class="fas fa-bell"></i>
                <span class="notification-badge" style="display:none">0</span>
            </button>
            <div class="user-menu">
                <div class="user-avatar"></div>
                <div class="user-info">
                    <div class="name"></div>
                    <div class="role"></div>
                </div>
                <div class="user-dropdown">
                    <a href="/perfil"><i class="fas fa-user"></i> Mi perfil</a>
                    <a href="#" onclick="event.preventDefault();logout()"><i class="fas fa-sign-out-alt"></i> Cerrar sesión</a>
                </div>
            </div>
        </div>
    </header>
    <main class="main-content">
        <div class="page-header">
            <h1>Alertas</h1>
            <div class="page-header-actions" id="pageActions" style="display:none">
                <button class="btn btn-primary" onclick="openModal()"><i class="fas fa-plus"></i> Nueva Alerta</button>
            </div>
        </div>
        <div id="alertasList">
            <div class="empty-state"><p>Cargando...</p></div>
        </div>
    </main>

    <div class="modal-overlay" id="alertaModal">
        <div class="modal">
            <div class="modal-header">
                <h3>Nueva Alerta</h3>
                <button class="modal-close" onclick="Modal.close('alertaModal')"><i class="fas fa-times"></i></button>
            </div>
            <form id="alertaForm">
                <div class="modal-body">
                    <div class="form-group">
                        <label>Título</label>
                        <input type="text" name="titulo" class="form-control" required placeholder="Ej: Aviso importante">
                    </div>
                    <div class="form-group">
                        <label>Descripción</label>
                        <textarea name="descripcion" class="form-control" rows="3" required placeholder="Detalle del aviso..."></textarea>
                    </div>
                    <div class="form-grid">
                        <div class="form-group">
                            <label>Tipo</label>
                            <select name="tipo" class="form-control">
                                <option value="aviso_institucional">Aviso Institucional</option>
                                <option value="nueva_actividad">Nueva Actividad</option>
                                <option value="encuesta_pendiente">Encuesta Pendiente</option>
                                <option value="actividad_proxima">Actividad Próxima</option>
                                <option value="propuesta_recibida">Propuesta Recibida</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Mostrar a</label>
                            <select name="destinatario" class="form-control">
                                <option value="Todos">Todos</option>
                                <option value="Estudiantes">Solo Estudiantes</option>
                                <option value="Profesores">Solo Profesores</option>
                            </select>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline" onclick="Modal.close('alertaModal')">Cancelar</button>
                    <button type="submit" class="btn btn-primary"><i class="fas fa-paper-plane"></i> Enviar Alerta</button>
                </div>
            </form>
        </div>
    </div>

    <script src="/static/js/app.js"></script>
    <script src="/static/js/alertas.js"></script>
</body>
</html>
