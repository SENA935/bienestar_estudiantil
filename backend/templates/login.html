<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Bienestar Estudiantil</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/responsive.css">
</head>
<body>
    <div class="login-page">
        <a href="/" class="btn-back-home" style="position:absolute;top:20px;left:20px;text-decoration:none;color:var(--primary);background:rgba(255,255,255,.9);padding:8px 16px;border-radius:8px;font-weight:600;display:flex;align-items:center;gap:8px;z-index:10"><i class="fas fa-arrow-left"></i> Volver al inicio</a>
        <div class="login-left">
            <img src="/static/img/logoo1.png" alt="Logo" style="width:100%;max-width:150px;height:auto">
            <h1>Bienestar Estudiantil</h1>
            <p>Salud Mental y Pausas Activas — Un espacio de escucha, orientación y crecimiento personal.</p>
        </div>
        <div class="login-right">
            <div class="login-card">
                <h2>Bienvenido</h2>
                <p class="subtitle">Ingresa tus credenciales para acceder al sistema</p>
                <div id="loginError" class="alert-inline error" style="display:none"></div>
                <form id="loginForm">
                    <div class="form-group">
                        <label for="email">Correo electrónico</label>
                        <div class="input-icon">
                            <i class="fas fa-envelope"></i>
                            <input type="email" id="email" class="form-control" placeholder="correo@ejemplo.com" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="password">Contraseña</label>
                        <div class="input-icon" style="position:relative">
                            <i class="fas fa-lock"></i>
                            <input type="password" id="password" class="form-control" placeholder="••••••••" style="padding-right:52px" required>
                            <button type="button" class="toggle-password" style="position:absolute;right:12px;top:50%;transform:translateY(-50%);background:transparent;border:none;color:var(--text-muted);cursor:pointer;font-size:18px;padding:4px 8px;z-index:5">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                    </div>
                    <div class="form-row">
                        <label><input type="checkbox" style="margin-right:6px"> Recordarme</label>
                        <a href="#" onclick="event.preventDefault();showRecuperar()">¿Olvidaste tu contraseña?</a>
                    </div>
                    <button type="submit" class="btn btn-primary btn-login">
                        <i class="fas fa-sign-in-alt"></i> Ingresar
                    </button>
                </form>
            </div>
        </div>
    </div>
    <script src="/static/js/app.js"></script>
    <script src="/static/js/auth.js"></script>
    <script>
        function showRecuperar(){
            const modal=document.createElement('div');
            modal.className='modal-overlay active';
            modal.innerHTML=`<div class="modal" style="max-width:420px">
                <div class="modal-header"><h3>Recuperar contraseña</h3><button class="modal-close" onclick="this.closest('.modal-overlay').remove()"><i class="fas fa-times"></i></button></div>
                <div class="modal-body">
                    <p style="color:var(--text-muted);font-size:13px;margin-bottom:16px">Ingresa tu correo electrónico registrado. Te enviaremos instrucciones para restablecer tu contraseña.</p>
                    <div class="form-group"><label>Correo electrónico</label><input type="email" id="recEmail" class="form-control" placeholder="correo@ejemplo.com"></div>
                    <div id="recMsg" style="font-size:13px;margin-top:10px"></div>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-outline" onclick="this.closest('.modal-overlay').remove()">Cancelar</button>
                    <button class="btn btn-primary" onclick="enviarRecuperar()">Enviar</button>
                </div>
            </div>`;
            document.body.appendChild(modal);
        }
        async function enviarRecuperar(){
            const email=document.getElementById('recEmail').value.trim();
            const msg=document.getElementById('recMsg');
            if(!email){msg.style.color='var(--danger)';msg.textContent='Ingresa un correo válido';return}
            msg.style.color='var(--text-muted)';msg.textContent='Enviando...';
            try{
                const r=await fetch('/api/auth/recuperar-contrasena',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email})});
                const d=await r.json();
                if(d.success){msg.style.color='var(--success)';msg.innerHTML='<i class="fas fa-check-circle"></i> '+d.message+'<br><small style="color:var(--text-muted);margin-top:6px;display:block">Revisa tu bandeja de entrada o contacta al administrador.</small>'}
                else{msg.style.color='var(--danger)';msg.textContent=d.message}
            }catch(e){msg.style.color='var(--danger)';msg.textContent='Error de conexión'}
        }
    </script>
</body>
</html>
